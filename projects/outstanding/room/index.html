<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OUTSTANDING</title>
<meta name="description" content="Every currently open public promise about rain in the United States, settled live, one at a time, as the sky answers.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="room">
  <canvas id="field" aria-hidden="true"></canvas>
  <canvas id="flares" aria-hidden="true"></canvas>
  <div id="reveal" aria-hidden="true"></div>
</div>

<!-- The work's only text. Never visible; reaches assistive technology only.
     Updated as the field's held state actually changes. -->
<div id="live" class="visually-hidden" role="status" aria-live="polite" aria-atomic="false"></div>

<script src="room.js"></script>
</body>
</html>
