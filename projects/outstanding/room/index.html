<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OUTSTANDING</title>
<link rel="icon" href="data:,">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #05070a; color: #cfe0ea; overflow: hidden;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  /* Sized in `em` from a base the script sets from the room's own scale unit, so the one
     place this work puts words on screen grows with the medium instead of staying at a
     desktop's 16 px on a four-metre projection. Below 1920 the base does not shrink: the
     type is already at the floor there and a phone is not this work's medium. */
  #panel {
    position: absolute; z-index: 3; pointer-events: none; opacity: 0;
    font-size: 16px;
    transition: opacity .28s ease; max-width: min(46ch, 80vw);
    background: rgba(6, 9, 13, .92); border: 1px solid rgba(140, 180, 210, .25);
    padding: .9em 1em; border-radius: 2px;
  }
  #panel.on { opacity: 1; }
  #panel .who { font-size: .72em; letter-spacing: .12em; color: rgba(200, 224, 238, .45); }
  #panel .per { font-size: .78em; letter-spacing: .08em; color: rgba(200, 224, 238, .62); margin-top: .35em; }
  #panel .say { font-size: 1.02em; line-height: 1.45; color: rgba(226, 240, 248, .94); margin-top: .55em; }
  /* `position: static` is load-bearing and was missing. The rule above sets every canvas
     in this document to `position: absolute; inset: 0` — written for the field, which is
     the only canvas the work had when it was written — and the trace strip inherited it,
     so it has been drawing out of flow across the office id and the period name since the
     held node was built, in a panel whose height reserved no space for it at all. Found
     2026-08-26 by measuring the panel's children instead of trusting the layout. */
  #panel .trace { position: static; margin-top: .7em; height: 2.1em; width: 100%; display: block; }
  #reader {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
  }
  #gate {
    position: absolute; inset: auto 0 6vh 0; z-index: 4; text-align: center;
    font-size: .74rem; letter-spacing: .18em; color: rgba(190, 216, 232, .30);
    transition: opacity 1.2s ease; pointer-events: none;
  }
  #gate.off { opacity: 0; }
</style>
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<div id="panel" role="dialog" aria-live="polite"></div>
<div id="reader" role="status" aria-live="polite"></div>
<div id="gate">&#8212;</div>
<script>
"use strict";
/* OUTSTANDING — a room of open public promises about rain, settled live by the sky.
 *
 * Two files arrive on this origin and are replaced in place by the relay
 * (tools/relay.py): data/claims.json — every currently open forecast period the
 * United States National Weather Service is publishing, with its sentence verbatim;
 * data/sky.json — every reporting station and what it says is falling now.
 * data/atlas.json is geography and does not move.
 *
 * WHAT THIS ROOM WILL NOT DO. It will not settle a promise it did not watch.
 * A window that closed while nobody was here leaves the field without a verdict:
 * it fades, unsounded. Only a claim whose window this room held open from its
 * beginning, or over which it saw water fall, is allowed to lock or to break.
 * The room's authority is its own duration and nothing else, which is why it is
 * worth leaving open.
 */

/* ------------------------------------------------------------------ constants */
const RELAY = { claims: "data/claims.json", sky: "data/sky.json", atlas: "data/atlas.json" };
const FIXTURE = { claims: "data/fixture-claims.json", sky: "data/fixture-sky.json", atlas: "data/atlas.json" };
const COLD = { claims: "data/fixture-cold-claims.json", sky: "data/fixture-cold-sky.json", atlas: "data/atlas.json" };
const REFRESH_MS = 150000;          // the page asks every 2.5 min; the relay writes every 10
// After this long without the relay's own stamp advancing, the room stops adjudicating.
// 25 minutes is 2.5 relay cycles: long enough that a slow or retrying cycle is not called
// death, short enough that nobody watches a corpse settle promises for half an hour.
const STALE_MS = 25 * 60 * 1000;
const RINGS = [12, 36, 72, 120, 168];        // ring upper bounds, hours of lead time
const RING_R = [10, 18, 26, 34, 43];         // outer radius per ring, in scale units
const RING_W = [6, 6, 5.5, 5.5, 5.5];          // band thickness
const PER_RING = 6;                          // arcs drawn per ring; the rest stay live, undrawn
const AFTERGLOW = { lock: 26000, rupture: 34000, silence: 55000 };
const REMOVE_AFTER = { lock: 95000, rupture: 125000, silence: 180000 };
const CONUS = { lat0: 24.4, lat1: 49.4, lon0: -125.0, lon1: -66.9 };
const LON_SQUEEZE = Math.cos(38.5 * Math.PI / 180);
const CARTOUCHE = { AK: [0.055, 0.80], HI: [0.135, 0.895], PR: [0.905, 0.885], PAC: [0.945, 0.79] };

const params = new URLSearchParams(location.search);
const SRC = params.has("cold") ? COLD : params.has("fixture") ? FIXTURE : RELAY;

/* --------------------------------------------------------------------- canvas */
const field = document.getElementById("field");
const ctx = field.getContext("2d", { alpha: false });
const still = document.createElement("canvas");     // the field, redrawn only on change
const sctx = still.getContext("2d");
let W = 0, H = 0, DPR = 1, U = 1, stillDirty = true;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(320, window.innerWidth); H = Math.max(240, window.innerHeight);
  field.width = still.width = Math.round(W * DPR);
  field.height = still.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  U = Math.min(W / 1920, H / 1080);
  if (U < 0.42) U = 0.42;
  layout();
  stillDirty = true;
}
window.addEventListener("resize", resize);

/* ------------------------------------------------------------------ the record */
let atlas = null, claims = null, sky = null;
let offices = [];                 // drawable nodes
let byId = new Map();
let lastIssued = new Map(), heartbeat = -1e9;
let relayAt = 0;                  // the instant the relay says it last wrote
let relayMoved = 0;               // when THIS room last watched that instant advance
let events = [];                  // live animations
let recent = [];                  // settlements this room witnessed, for the held-node trace
let reissues = [];                // re-issuances this room watched, for the same trace
let openedAt = Date.now();
let stationOwner = new Map();     // station -> office id
let wetSpans = new Map();         // office id -> [[t0,t1], ...] observed by THIS room
let officeWet = new Map();        // office id -> last epoch (ms) seen wet
let settledKeys = new Set();

async function grab(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(url + " " + r.status);
  return r.json();
}

/* The instant the relay itself says it wrote a file. Both files carry it, every cycle,
   whether or not anything in the country moved. */
function stamp(doc) {
  const t = doc && doc.generated ? Date.parse(doc.generated) : NaN;
  return isFinite(t) ? t : 0;
}

/* Has the record stopped advancing while this room has been standing here?
 *
 * Measured from the last time the room WATCHED the stamp move, and from the door
 * opening before it has ever seen that happen — the same rule as everything else here:
 * the room's authority is its own duration, so at minute zero it is not entitled to
 * call anything stale either. A frozen fixture and a dead relay are the same object
 * and are treated as one. */
function stale() { return Date.now() - relayMoved > STALE_MS; }

/* ------------------------------------------------- the room audits its own supply
 *
 * The pulse above catches a relay that has STOPPED writing. It cannot catch one that is
 * running and writing wrongly, and this project has already been bitten by exactly that:
 * on 2026-08-25 a relay resolved every office as UTC — TODAY and TONIGHT are local words
 * — and wrote a complete, 5 MB, confidently-stamped national record in which every one of
 * 46,965 windows was wrong by four to ten hours. Nothing in the file said so. It advanced
 * its stamp every cycle and read as perfectly alive.
 *
 * So the room applies to its supply the one test it applies to everything else here: a
 * claim, checked against what else can be seen. The record states, for every period, the
 * twelve hours it covers. The atlas states, for every office, the zone it stands in. The
 * service's day period runs 06:00–18:00 LOCAL and its night period 18:00–06:00 local, so
 * a window start that is not local six o'clock, one way or the other, is a window resolved
 * against hours that are not the office's own. Measured against tonight's live national
 * record: 24,318 of 24,319 datable starts land exactly there. Under the fault: near none.
 *
 * This does not read the relay's opinion of itself. `counts` is computed by the relay from
 * the same structure it writes, in one pass, so a record can never disagree with it — and
 * the faulted record's counts were all correct. Checking them would be a check that cannot
 * fail and cannot catch anything. Geography is a second witness; a self-description is not.
 *
 * It is a country-scale test and only a country-scale test. One office out of place — and
 * there have been three, silently, since this relay was written — does not close the room;
 * it takes a fifth of the country, which is a shape only a systematic resolution fault has.
 */
const BOUNDARY_MIN = [6 * 60, 18 * 60];   // local six, morning and evening
const MISPLACED_FRACTION = 0.2;           // a fifth of the offices the record names
const AUDIT_SAMPLE = 24;                  // datable claims sampled per office; a majority test
let supplyFault = null;      // the audit's verdict on the record now in hand, when it fired
let lastAudit = null;        // and what it saw, whether or not it fired
const zoneFmt = new Map();

function localMinutes(tz, ms) {
  let f = zoneFmt.get(tz);
  if (f === undefined) {
    try {
      f = new Intl.DateTimeFormat("en-GB", { timeZone: tz, hour: "2-digit",
                                             minute: "2-digit", hourCycle: "h23" });
    } catch (e) { f = null; }                  // a zone this runtime cannot resolve
    zoneFmt.set(tz, f);
  }
  if (!f) return null;
  const p = f.formatToParts(new Date(ms));
  let h = null, m = null;
  for (const q of p) { if (q.type === "hour") h = +q.value; else if (q.type === "minute") m = +q.value; }
  return h == null || m == null ? null : h * 60 + m;
}

/* Does this record place its offices in their own hours?
 *
 * Always answers with what it saw. A check that returns "nothing to report" both when the
 * record is sound and when the check could not run is the same blindness this room has now
 * been caught by twice — a fetch of unchanged bytes reading as a fresh one, a blank strip
 * reading as an uneventful place. `placed` is how many offices it was actually able to put
 * a question to; if that is zero the audit did not happen and says so, and a check that did
 * not happen never withholds. */
function audit(doc) {
  if (!doc || !doc.offices || !atlas) return { ran: false, placed: 0, misplaced: 0, share: 0,
                                               offices: [], fault: false };
  let placed = 0, misplaced = 0;
  const wrong = [];
  for (const [id, rec] of Object.entries(doc.offices)) {
    const tz = (atlas.offices[id] || {}).tz;
    if (!tz) continue;                          // the room was never told where this is
    const dated = (rec.claims || []).filter(c => c.s);
    if (!dated.length) continue;
    const step = Math.max(1, Math.floor(dated.length / AUDIT_SAMPLE));
    let seen = 0, off = 0;
    for (let i = 0; i < dated.length && seen < AUDIT_SAMPLE; i += step) {
      const mins = localMinutes(tz, Date.parse(dated[i].s));
      if (mins == null) break;
      seen++;
      if (BOUNDARY_MIN.indexOf(mins) < 0) off++;
    }
    if (!seen) continue;
    placed++;
    if (off * 2 > seen) { misplaced++; wrong.push(id); }
  }
  const share = placed ? misplaced / placed : 0;
  return { ran: placed > 0, placed: placed, misplaced: misplaced,
           share: Math.round(share * 1000) / 1000, offices: wrong.slice(0, 12),
           fault: placed > 0 && share > MISPLACED_FRACTION };
}

/* One posture, two reasons, and the face does not distinguish them — see the note in
 * drawStill(). A room whose source has gone quiet and a room whose source is lying to it
 * have the same standing: its authority over what it draws next is gone. The distinction
 * is a fact about plumbing, and this work does not put plumbing on its face. It is kept
 * here, off the face, so that an instrument in front of the room can say which gate
 * closed it without the room having to say it out loud. */
function withheld() { return supplyFault ? "false" : (stale() ? "quiet" : null); }
function supply() { return { withheld: withheld(), fault: supplyFault, audit: lastAudit,
                             relayAt: relayAt, relayMoved: relayMoved, openedAt: openedAt }; }

async function pull(first) {
  try {
    if (!atlas) {
      atlas = await grab(SRC.atlas);
      for (const [id, o] of Object.entries(atlas.offices || {})) {
        for (const s of o.stations || []) stationOwner.set(s, id);
      }
      layout();
    }
    const [c, s] = await Promise.all([grab(SRC.claims), grab(SRC.sky)]);
    claims = c; sky = s;
    // A fetch that succeeds is not a heartbeat. A relay that has stopped writing answers
    // every request with the same bytes, and 200 OK is silent about that; for one night
    // this room read a file that was not moving and reported a quiet country. The pulse
    // is the relay's own stamp advancing, and nothing else is allowed to stand for it.
    const wrote = Math.max(stamp(c), stamp(s));
    if (wrote > relayAt) { relayAt = wrote; relayMoved = Date.now(); heartbeat = performance.now(); }
    // A fresh stamp is not the same as a true record. The audit runs on what arrived,
    // every time, and its verdict is about the record now in hand and nothing older.
    lastAudit = audit(c);
    supplyFault = lastAudit.fault ? lastAudit : null;
    absorbSky();
    rebuild(first);
  } catch (e) {
    /* A room that cannot reach its relay says nothing and invents nothing. It is also
       not told anything, so its clock above does not move and it will fall silent on the
       same terms as a room whose relay answers and has nothing new to say. */
  }
}

/* Every wet observation this room has read, kept with the instant the sky made it.
 *
 * Two instants matter and they are not the same. `t` is when the water was observed;
 * it is what decides which promise the observation answers. `openedAt` is when this
 * room began. An observation older than the room settles its claim — the promise is
 * no longer owed — but it does not flare and it does not sound, because the room did
 * not see it happen. Only what arrived after the door opened is allowed to be an
 * event. This is what keeps minute zero from being a field of finished answers. */
function absorbSky() {
  if (!sky || !sky.stations) return;
  // Six hours back from the instant the SKY was read, not from the wall clock. Against
  // wall time a frozen sky goes on evicting real observations as the hours pass, and the
  // room then answers "no water was seen here" about water it had been shown — a false
  // dry verdict manufactured out of its own source having died.
  const cutoff = (stamp(sky) || Date.now()) - 6 * 3600000;
  for (const [id, st] of Object.entries(sky.stations)) {
    if (!st.r || !st.t) continue;
    const owner = stationOwner.get(id);
    if (!owner) continue;                       // outside the record's jurisdiction
    const at = st.t * 1000;
    officeWet.set(owner, Math.max(officeWet.get(owner) || 0, at));
    const seen = wetSpans.get(owner) || [];
    if (!seen.some(x => x.st === id && Math.abs(x.t - at) < 60000)) seen.push({ st: id, t: at });
    wetSpans.set(owner, seen.filter(x => x.t > cutoff));
  }
}

/* Returns the observation that answers this window, or null.
 *
 * THE EARLIEST ONE, and that was a defect until 2026-08-29. `wetSpans` is appended in the
 * order stations are first seen wet — station-id order within one pull, arrival order
 * across pulls — so it is not in time order. This function used to return the first array
 * match, which meant that for any office with two wet stations inside one period the
 * room's verdict was decided by an alphabetical accident: an old observation sitting
 * earlier in the array made the settlement `unwitnessed` and removed the claim in silence,
 * while the same two observations under a different station-id ordering flared. Neither
 * outcome was reasoned; the array's order was.
 *
 * The rule the work already states decides it: the promise is answered by the FIRST water
 * that falls inside its window, and whether the room may call that an event depends on
 * whether the room was open when it fell. So the earliest matching observation is the
 * answer, always — which loses flares as often as it gains them (a room that opens after
 * the first water now stays silent where the accident sometimes let it ring) and is the
 * point: the room does not claim to have witnessed water that fell before its door. */
function witnessedWet(officeId, from, to) {
  const seen = wetSpans.get(officeId);
  if (!seen) return null;
  let best = null;
  for (const obs of seen) if (obs.t >= from && obs.t <= to && (!best || obs.t < best.t)) best = obs;
  return best;
}

/* --------------------------------------------------------------------- layout */
function project(lat, lon) {
  const x = (lon - CONUS.lon0) * LON_SQUEEZE, xr = (CONUS.lon1 - CONUS.lon0) * LON_SQUEEZE;
  const y = (CONUS.lat1 - lat), yr = (CONUS.lat1 - CONUS.lat0);
  // The box only ever held centres, so an office sitting on the CONUS boundary — Caribou
  // on the east edge, the border towns on the others — drew its outer ring half off the
  // frame. Inset the box by that ring's own radius on every side so the ring, not the
  // centre, is what the 0.88/0.82 padding is measured to.
  const margin = RING_R[RING_R.length - 1] * U;
  const boxW = W * 0.88 - 2 * margin, boxH = H * 0.82 - 2 * margin;
  const scale = Math.min(boxW / xr, boxH / yr);
  return [ margin + (W - 2 * margin - xr * scale) / 2 + x * scale,
           margin + (H - 2 * margin - yr * scale) / 2 + y * scale ];
}

function region(lat, lon) {
  if (lat > 50 && lon < -125) return "AK";
  if (lat < 24 && lon < -140) return "HI";
  // Guam sits at +145..+158 and answered `lon > -70` too — every eastern-hemisphere
  // longitude does — so it was drawn in Puerto Rico's corner. The western Pacific is
  // tested first, and the Caribbean test is bounded to the western hemisphere it lives in.
  if (lon > 100) return "PAC";
  if (lon > -70 && lon < 0 && lat < 22) return "PR";
  return null;
}

function layout() {
  if (!atlas) return;
  offices = []; byId = new Map();
  // The same clearance the mainland relaxation pass insists on below, used here too so
  // an inset cluster is already spread to it before relaxation ever gets a turn.
  const want = 1.25 * RING_R[RING_R.length - 1] * U;
  const groups = { AK: [], HI: [], PR: [], PAC: [] };
  for (const [id, o] of Object.entries(atlas.offices || {})) {
    if (o.lat == null || o.lon == null) continue;   // 5 offices this channel cannot place
    const reg = region(o.lat, o.lon);
    const node = { id: id, lat: o.lat, lon: o.lon, arcs: [], live: [], x: 0, y: 0,
                   unheard: true, n: (id.charCodeAt(0) + id.charCodeAt(2)) % 7 };
    if (reg) groups[reg].push(node);
    else { const p = project(o.lat, o.lon); node.x = p[0]; node.y = p[1]; }
    offices.push(node); byId.set(id, node);
  }
  for (const key of Object.keys(groups)) {
    const g = groups[key]; if (!g.length) continue;
    const cx = CARTOUCHE[key][0] * W, cy = CARTOUCHE[key][1] * H;
    const lats = g.map(n => n.lat), lons = g.map(n => n.lon);
    const la0 = Math.min(...lats), la1 = Math.max(...lats);
    const lo0 = Math.min(...lons), lo1 = Math.max(...lons);
    const place = span => g.map(n => [
      cx + (la1 === la0 ? 0 : ((n.lon - lo0) / (lo1 - lo0) - 0.5) * span),
      cy - (la1 === la0 ? 0 : ((n.lat - la0) / (la1 - la0) - 0.5) * span * 0.6)
    ]);
    // A single office needs no spread. A cluster — Alaska's three — is sized by what it
    // actually holds: how tightly its real shape packs at unit span sets how far that
    // span must stretch for its closest pair to already clear the relaxation pass's own
    // threshold, so the cap below never has to fight a cluster this cramped. The inset's
    // distance to the screen edge sets the most it is allowed to stretch. Neither number
    // is Alaska's; both fall out of the group and the room it was given.
    let span = 70 * U;
    if (g.length > 1) {
      const outer = RING_R[RING_R.length - 1] * U, margin = 0.25 * outer;
      const unit = place(1);
      let closest = Infinity;
      for (let i = 0; i < unit.length; i++) for (let j = i + 1; j < unit.length; j++)
        closest = Math.min(closest, Math.hypot(unit[i][0] - unit[j][0], unit[i][1] - unit[j][1]));
      const legible = want / closest;
      const room = Math.min(
        (cx - outer - margin) / 0.5, (W - margin - outer - cx) / 0.5,
        (cy - outer - margin) / 0.3, (H - margin - outer - cy) / 0.3
      );
      span = Math.max(20 * U, Math.min(legible, room));
    }
    const pos = place(span);
    g.forEach((n, i) => { n.x = pos[i][0]; n.y = pos[i][1]; });
  }
  // Relaxation: no two node centres letter over each other, and no node travels far
  // enough from its true place to make the map a lie. Rings are allowed to overlap —
  // the east really is that crowded, and pretending otherwise would be the lie.
  const cap = 16 * U;
  offices.forEach(n => { n.x0 = n.x; n.y0 = n.y; });
  for (let pass = 0; pass < 8; pass++) {
    for (let i = 0; i < offices.length; i++) {
      for (let j = i + 1; j < offices.length; j++) {
        const a = offices[i], b = offices[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d = Math.hypot(dx, dy) || 0.01;
        if (d >= want) continue;
        const push = (want - d) * 0.12;
        dx /= d; dy /= d;
        a.x -= dx * push; a.y -= dy * push; b.x += dx * push; b.y += dy * push;
      }
    }
    for (const n of offices) {
      const dx = n.x - n.x0, dy = n.y - n.y0, d = Math.hypot(dx, dy);
      if (d > cap) { n.x = n.x0 + dx / d * cap; n.y = n.y0 + dy / d * cap; }
    }
  }
}

/* -------------------------------------------------------------- the claim field */
function ringOf(claim, now) {
  if (!claim.e) return 4;
  const mid = claim.s ? (Date.parse(claim.s) + Date.parse(claim.e)) / 2 : Date.parse(claim.e);
  const lead = (mid - now) / 3600000;
  for (let i = 0; i < RINGS.length; i++) if (lead < RINGS[i]) return i;
  return RINGS.length - 1;
}

function rebuild(first) {
  if (!claims || !atlas) return;
  const now = Date.now();
  const sweeps = [];
  const heard = [];
  const told = new Set(Object.keys(claims.offices || {}));
  for (const node of offices) node.unheard = !told.has(node.id);
  for (const [id, rec] of Object.entries(claims.offices || {})) {
    const node = byId.get(id); if (!node) continue;
    const before = lastIssued.get(id);
    if (!first) {
      if (before === undefined) heard.push(node);       // the room did not know this office until now
      else if (before !== rec.issued) sweeps.push(node); // an office it already knew, re-issuing
    }
    lastIssued.set(id, rec.issued);

    const buckets = [[], [], [], [], []];
    node.live = [];
    for (let k = 0; k < rec.claims.length; k++) {
      const c = rec.claims[k];
      if (!c.e) continue;
      const end = Date.parse(c.e), start = c.s ? Date.parse(c.s) : end - 43200000;
      if (end <= now) continue;
      const item = { c: c, office: id, start: start, end: end,
                     key: id + "|" + rec.issued + "|" + k, ring: ringOf(c, now) };
      node.live.push(item);
      const b = buckets[item.ring];
      if (b.length < PER_RING) b.push(item);
    }
    // The record's own order, not ours: arcs are taken as the bulletin wrote them.
    const arcs = [];
    for (let r = 0; r < buckets.length; r++) {
      const b = buckets[r];
      for (let i = 0; i < b.length; i++) {
        b[i].a0 = (i / b.length) * Math.PI * 2 + 0.022;
        b[i].a1 = ((i + 1) / b.length) * Math.PI * 2 - 0.022;
        arcs.push(b[i]);
      }
    }
    node.arcs = arcs;
  }
  // A re-issuance is as witnessed as a settlement is — the room only calls one when it
  // held the office's previous bulletin itself — so it belongs in a place's history and
  // not only in a 1.6-second hand. It carries no verdict, and is never given a verdict's
  // colour: how often a place speaks is not whether what it said came true.
  for (const node of sweeps) {
    events.push({ kind: "sweep", node: node, t0: performance.now() });
    reissues.push({ office: node.id, t: Date.now() });
  }
  if (reissues.length > 400) reissues.splice(0, reissues.length - 400);
  for (const node of heard) events.push({ kind: "heard", node: node, t0: performance.now() });
  stillDirty = true;
  speak();
}

/* --------------------------------------------------------------- the settlement */
function settle() {
  // The room adjudicates only while it is being told things. With the record standing
  // still it would go on closing windows against a clock and an observation set nobody
  // has refreshed — locking dry verdicts it cannot witness, ruptures it cannot witness,
  // for as long as a week, because the outermost ring reaches 168 hours out. It would
  // look exactly like a room over a quiet country, which is the failure of one whole
  // night of this house's record. So it stops, and the field simply holds.
  //
  // The same for a record that is arriving and is false: a verdict drawn from windows
  // resolved against the wrong hours is not a weaker verdict, it is a manufactured one,
  // and it would land on screen looking exactly as authoritative as a true one. What the
  // room has already rung, it cannot un-ring; it stops ringing. Nothing is retracted and
  // nothing is re-marked — a room whose authority is its own duration cannot spend
  // duration backwards.
  if (withheld()) return;
  const now = Date.now();
  for (const node of offices) {
    for (const item of node.live) {
      if (settledKeys.has(item.key)) continue;
      const rain = !!item.c.w;
      const obs = witnessedWet(node.id, item.start, Math.min(item.end, now));
      if (obs) {
        settledKeys.add(item.key);
        // The water fell inside the promise. Whether the room may call it an event
        // depends on whether the room was open when it fell.
        fire(node, item, obs.t > openedAt ? (rain ? "lock" : "silence") : "unwitnessed");
        continue;
      }
      if (now >= item.end) {
        settledKeys.add(item.key);
        // Held from its beginning, or not held at all. The room speaks only for what it held.
        if (item.start >= openedAt) fire(node, item, rain ? "rupture" : "lock");
        else fire(node, item, "unwitnessed");
      }
    }
  }
}

function fire(node, item, kind) {
  const ev = { kind: kind, node: node, item: item, t0: performance.now() };
  events.push(ev);
  if (kind !== "unwitnessed") {
    recent.push({ office: node.id, kind: kind, t: Date.now(), text: item.c.t, period: item.c.p });
    if (recent.length > 400) recent.splice(0, recent.length - 400);
    sound(kind, node);
    speak(item, kind);
  }
  const idx = node.arcs.indexOf(item);
  if (idx >= 0) { node.arcs.splice(idx, 1); stillDirty = true; }
}

/* ---------------------------------------------------------------------- drawing */
/* The room's own withdrawal, drawn.
 *
 * Until tonight a room that had stopped adjudicating was drawn as nothing: settle()
 * returned and the field simply held, which from four metres away is indistinguishable
 * from a quiet country where no window happens to be closing. That is the one confusion
 * this work has spent three sessions killing everywhere else — an office it has not been
 * told about is bare and never empty; a forecast naming no rain is a dim band and never
 * blank space; a held node hatches the span older than the room so that "nothing happened
 * here" cannot be read as "this room had not opened yet". The room was applying that law
 * to every fact except one: its own standing.
 *
 * So while it is withholding, the whole field goes to the bare mark. Not a badge, not a
 * word, not a light in a corner — the same cool grey stroke that already means "no
 * statement is being made here", applied to every band at once. Nothing is added and
 * nothing moves; the picture's temperature changes. A country cannot honestly look like
 * this: every office bare at once is a thing only the room can be. And it says nothing
 * about WHY, because a visitor cannot read two greys apart at that distance and because
 * the difference between a source gone quiet and a source gone wrong is a fact about
 * plumbing, which this work keeps off its face.
 */
const BARE = "rgba(140,160,175,0.22)";

function drawStill() {
  sctx.fillStyle = "#05070a";
  sctx.fillRect(0, 0, W, H);
  const mute = !!withheld();
  for (const node of offices) {
    if (node.unheard) {
      // Not silent — unheard. This room has never been told what this office is
      // promising, so it draws nothing that could be mistaken for a statement:
      // no band, no arcs, just the bare mark that a place is on the record.
      sctx.strokeStyle = BARE;
      sctx.lineWidth = 1 * U;
      sctx.beginPath(); sctx.arc(node.x, node.y, 2.5 * U, 0, 6.2832); sctx.stroke();
      continue;
    }
    if (mute) {
      sctx.strokeStyle = BARE;
      sctx.lineWidth = 1 * U;
      sctx.beginPath(); sctx.arc(node.x, node.y, 2.5 * U, 0, 6.2832); sctx.stroke();
    } else {
      sctx.fillStyle = "rgba(180,210,230,0.38)";
      sctx.beginPath(); sctx.arc(node.x, node.y, 2.5 * U, 0, 6.2832); sctx.fill();
    }
    for (const item of node.arcs) {
      const r = RING_R[item.ring] * U, w = RING_W[item.ring] * U;
      const c = item.c;
      sctx.lineWidth = w;
      if (mute) {
        // The band is still there, in its place, at its width. What is gone is the
        // room's word for it: the number's brightness, the commitment's stipple, the
        // silence's other substance. All of it is the same statement — that the room
        // stands behind what it is showing — and the room does not, just now.
        sctx.strokeStyle = BARE;
        arc(sctx, node, r, item.a0, item.a1);
      } else if (c.n != null) {
        // measured to a point: a dark rail with a bright segment and a hard cap
        sctx.strokeStyle = "rgba(120,160,190,0.08)";
        arc(sctx, node, r, item.a0, item.a1);
        const p = Math.max(0, Math.min(100, c.n)) / 100;
        const a1 = item.a0 + (item.a1 - item.a0) * p;
        sctx.strokeStyle = "hsla(202,30%,72%," + (0.30 + 0.55 * p).toFixed(3) + ")";
        arc(sctx, node, r, item.a0, a1);
        sctx.lineWidth = 1.5 * U;
        sctx.strokeStyle = "hsla(202,34%,84%," + (0.45 + 0.5 * p).toFixed(3) + ")";
        arc(sctx, node, r + w * 0.5 - 0.75 * U, a1 - 0.012, a1 + 0.012);
      } else if (c.w) {
        // committed, unmeasured: stippled, no end
        sctx.strokeStyle = "hsla(202,24%,66%,0.40)";
        sctx.setLineDash([3 * U, 2.5 * U]);
        sctx.lineDashOffset = (item.a0 * 30) % 12;
        arc(sctx, node, r, item.a0, item.a1);
        sctx.setLineDash([]);
      } else {
        // silence: a continuous band of a different substance. Never blank space.
        sctx.strokeStyle = "hsla(210,13%,38%,0.50)";
        arc(sctx, node, r, item.a0, item.a1);
      }
    }
  }
  stillDirty = false;
}

function arc(c, node, r, a0, a1) {
  c.beginPath(); c.arc(node.x, node.y, r, a0, a1); c.stroke();
}

let drawnWithheld = null;

function frame(t) {
  // The withdrawal is the one change to the field that no rebuild announces: staleness
  // arrives by the clock and the audit's verdict by a pull that changed nothing else.
  // Marked on the TRANSITION only. Session 111 deleted a line that set this flag on a
  // timer, under a comment claiming the room had stopped changing, and it fought
  // drawStill() for the same flag every frame; this asks the question and then waits.
  const wh = withheld();
  if (wh !== drawnWithheld) { drawnWithheld = wh; stillDirty = true; }
  if (stillDirty) drawStill();
  ctx.drawImage(still, 0, 0, W, H);

  let dim = 1;
  for (const ev of events) {
    if (ev.kind === "silence") {
      const age = t - ev.t0;
      if (age < 2500) dim = Math.min(dim, 0.55 + 0.45 * Math.max(0, (age - 1600) / 900));
    }
  }
  if (dim < 1) { ctx.fillStyle = "rgba(5,7,10," + (1 - dim).toFixed(3) + ")"; ctx.fillRect(0, 0, W, H); }

  const keep = [];
  for (const ev of events) {
    const age = t - ev.t0;
    if (drawEvent(ev, age)) keep.push(ev);
  }
  events = keep;

  const hb = t - heartbeat;
  if (hb < 900) {
    const y = (hb / 900) * H;
    ctx.strokeStyle = "rgba(170,205,225,0.08)"; ctx.lineWidth = 1 * U;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  if (held || releasing) drawHeld(t);
  requestAnimationFrame(frame);
}

function drawEvent(ev, age) {
  const node = ev.node;
  if (ev.kind === "sweep") {
    if (age > 1600) return false;
    const a = -Math.PI / 2 + (age / 1600) * Math.PI * 2;
    const r = RING_R[RING_R.length - 1] * U;
    ctx.strokeStyle = "rgba(150,190,215,0.50)"; ctx.lineWidth = 2 * U;
    ctx.beginPath(); ctx.moveTo(node.x, node.y);
    ctx.lineTo(node.x + Math.cos(a) * r, node.y + Math.sin(a) * r); ctx.stroke();
    return true;
  }
  if (ev.kind === "heard") {
    // The room learning an office exists, not the sky answering a promise — no truth
    // value, so it gets none of the settlements' color or sound. One soft ring,
    // once, blooming outward from the bare mark and gone.
    if (age > 2200) return false;
    const p = age / 2200;
    ctx.strokeStyle = "rgba(160,180,195," + (0.24 * (1 - p)).toFixed(3) + ")";
    ctx.lineWidth = 1 * U;
    ctx.beginPath(); ctx.arc(node.x, node.y, 2.5 * U + p * 34 * U, 0, 6.2832); ctx.stroke();
    return true;
  }
  const item = ev.item;
  const r = RING_R[item.ring] * U, w = RING_W[item.ring] * U;
  if (ev.kind === "unwitnessed") {
    if (age > 900) return false;
    ctx.lineWidth = w;
    ctx.strokeStyle = "rgba(120,150,170," + (0.16 * (1 - age / 900)).toFixed(3) + ")";
    arc(ctx, node, r, item.a0 || 0, item.a1 || 6.28);
    return true;
  }
  if (ev.kind === "lock") {
    if (age > REMOVE_AFTER.lock) return false;
    const g = age < 420 ? age / 420 : 1;
    const glow = Math.exp(-Math.max(0, age - 620) / AFTERGLOW.lock);
    const rr = r - 4 * U * g;
    ctx.lineWidth = w;
    ctx.strokeStyle = "hsla(187,68%," + (52 + 12 * g) + "%," + (0.95 * glow).toFixed(3) + ")";
    arc(ctx, node, rr, item.a0 || 0, item.a1 || 6.28);
    if (age > 420 && age < 1320) {
      const p = (age - 420) / 900;
      const a = (item.a0 || 0) + ((item.a1 || 6.28) - (item.a0 || 0)) * p;
      ctx.lineWidth = 1.5 * U; ctx.strokeStyle = "rgba(200,248,255,0.95)";
      arc(ctx, node, rr, a - 0.03, a + 0.03);
    }
    return true;
  }
  if (ev.kind === "rupture") {
    if (age > REMOVE_AFTER.rupture) return false;
    const g = Math.min(1, age / 700);
    const glow = Math.exp(-Math.max(0, age - 700) / AFTERGLOW.rupture);
    const hue = 202 + (18 - 202) * g;
    const spread = 0.12 * g, out = 7 * U * g;
    ctx.lineWidth = w;
    ctx.strokeStyle = "hsla(" + hue.toFixed(0) + ",65%,60%," + (0.9 * glow).toFixed(3) + ")";
    const mid = ((item.a0 || 0) + (item.a1 || 6.28)) / 2;
    arc(ctx, node, r + out, item.a0 || 0, mid - spread);
    arc(ctx, node, r + out, mid + spread, item.a1 || 6.28);
    if (age < 1100) {
      const rr = (age / 1100) * 130 * U;
      ctx.lineWidth = 1.2 * U;
      ctx.strokeStyle = "hsla(18,65%,60%," + (0.18 * (1 - age / 1100)).toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(node.x, node.y, rr, 0, 6.2832); ctx.stroke();
    }
    return true;
  }
  if (ev.kind === "silence") {
    if (age > REMOVE_AFTER.silence) return false;
    const glow = Math.exp(-Math.max(0, age - 250) / AFTERGLOW.silence);
    ctx.lineWidth = w * 1.15;
    ctx.strokeStyle = "rgba(255,255,255," + Math.min(1, 1.0 * glow).toFixed(3) + ")";
    arc(ctx, node, r, item.a0 || 0, item.a1 || 6.28);
    if (age > 250 && age < 2400) {
      const p = (age - 250) / 2150;
      ctx.lineWidth = 2 * U;
      ctx.strokeStyle = "rgba(255,255,255," + (0.55 * (1 - p)).toFixed(3) + ")";
      ctx.beginPath();
      ctx.arc(node.x, node.y, p * 168 * U, 0, 6.2832); ctx.stroke();
    }
    return true;
  }
  return false;
}

/* ------------------------------------------------------------------------ sound */
let ac = null, master = null;
function unlock() {
  if (ac) return;
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
  } catch (e) { ac = null; }
  document.getElementById("gate").className = "off";
}
window.addEventListener("pointerdown", unlock, { once: true });
window.addEventListener("keydown", unlock, { once: true });

let voices = 0, lastSound = 0;
function sound(kind, node) {
  if (!ac || ac.state === "suspended") return;
  const now = ac.currentTime;
  if (kind !== "silence") {
    if (voices > 12) return;
    if (performance.now() - lastSound < 160) return;
  }
  lastSound = performance.now();
  const f0 = 196 * Math.pow(2, [0, 3, 5, 7, 10, 12, 15][node.n] / 12);
  const pan = ac.createStereoPanner ? ac.createStereoPanner() : null;
  if (pan) pan.pan.value = Math.max(-0.85, Math.min(0.85, (node.x / W) * 2 - 1));
  const out = pan || master; if (pan) pan.connect(master);
  const g = ac.createGain(); g.connect(out);
  voices++;
  const done = () => { voices--; try { g.disconnect(); if (pan) pan.disconnect(); } catch (e) {} };

  if (kind === "lock") {
    const o = ac.createOscillator(), o2 = ac.createOscillator();
    o.type = o2.type = "sine"; o.frequency.value = f0; o2.frequency.value = f0 * 3;
    const g2 = ac.createGain(); g2.gain.value = 0.18; o2.connect(g2); g2.connect(g);
    o.connect(g);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.12, now + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);
    o.start(now); o2.start(now); o.stop(now + 0.92); o2.stop(now + 0.92);
    o.onended = done;
  } else if (kind === "rupture") {
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = 1.2;
    lp.frequency.setValueAtTime(1800, now);
    lp.frequency.exponentialRampToValueAtTime(220, now + 0.5);
    lp.connect(g);
    const a = ac.createOscillator(), b = ac.createOscillator();
    a.type = b.type = "sawtooth"; a.frequency.value = f0 / 2; b.frequency.value = f0 / 2 * 1.004;
    a.connect(lp); b.connect(lp);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.16, now + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
    a.start(now); b.start(now); a.stop(now + 0.62); b.stop(now + 0.62);
    a.onended = done;
  } else {
    const sub = ac.createOscillator(); sub.type = "sine"; sub.frequency.value = 55;
    const gl = ac.createOscillator(); gl.type = "sine";
    gl.frequency.setValueAtTime(180, now);
    gl.frequency.exponentialRampToValueAtTime(720, now + 1.2);
    const gg = ac.createGain(); gg.gain.value = 0.22; gl.connect(gg); gg.connect(g);
    sub.connect(g);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.5, now + 0.35);
    g.gain.setValueAtTime(0.5, now + 1.4);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 2.6);
    sub.start(now); gl.start(now); sub.stop(now + 2.62); gl.stop(now + 2.62);
    sub.onended = done;
  }
}

/* -------------------------------------------------------------------- held node */
let held = null, heldItem = null, heldSince = 0;
let lastHeld = null, releasing = 0;
const RELEASE_MS = 420;
const panel = document.getElementById("panel");

function nearest(x, y) {
  let best = null, bd = 1e9;
  for (const node of offices) {
    const d = Math.hypot(node.x - x, node.y - y);
    if (d < bd) { bd = d; best = node; }
  }
  return bd < RING_R[RING_R.length - 1] * U * 1.4 ? best : null;
}

function pick(node, x, y) {
  let a = Math.atan2(y - node.y, x - node.x); if (a < 0) a += Math.PI * 2;
  const d = Math.hypot(x - node.x, y - node.y) / U;
  let ring = 0; for (let i = 0; i < RING_R.length; i++) if (d > RING_R[i] - RING_W[i]) ring = i;
  let hit = null;
  for (const item of node.arcs) {
    if (item.ring !== ring) continue;
    if (a >= item.a0 && a <= item.a1) { hit = item; break; }
    if (!hit) hit = item;
  }
  return hit || node.arcs[0] || null;
}

function hold(x, y) {
  const node = nearest(x, y); if (!node) { release(); return; }
  const item = pick(node, x, y);
  if (!item) { release(); return; }
  // The dwell clock starts once, when a place is first taken hold of. It used to be reset
  // by every pointermove, so the nine seconds measured how much the visitor's hand was
  // moving and not how long they had held the place — a duration owned by jitter, in a
  // work whose entire subject is what a duration entitles you to say.
  const fresh = node !== held;
  if (fresh) { heldSince = performance.now(); releasing = 0; }
  // And a hand crossing an arc boundary used to tear the panel down and rebuild it on
  // every pixel, re-drawing the trace and re-speaking the sentence into the live region
  // each time. Nothing new is being said, so nothing is said again.
  if (!fresh && heldItem && item.key === heldItem.key) { held = lastHeld = node; return; }
  held = lastHeld = node; heldItem = item;
  panel.innerHTML = "";
  const who = document.createElement("div"); who.className = "who"; who.textContent = node.id;
  const per = document.createElement("div"); per.className = "per"; per.textContent = heldItem.c.p;
  const say = document.createElement("div"); say.className = "say"; say.textContent = heldItem.c.t;
  panel.append(who, per, say);
  const cv = document.createElement("canvas");
  cv.className = "trace"; cv.width = 320; cv.height = 34; panel.append(cv);
  drawTrace(cv, node.id);
  const em = 16 * Math.max(1, U);
  panel.style.fontSize = em + "px";
  const off = 70 * U, wide = Math.min(W * 0.8, 26 * em);
  const left = node.x < W / 2 ? node.x + off : node.x - off - wide;
  panel.style.left = Math.max(8, Math.min(W - 40, left)) + "px";
  panel.style.top = Math.max(8, Math.min(H - 10 * em, node.y - 2.5 * em)) + "px";
  panel.className = "on";
  speak(heldItem, "held");
}

/* Ninety minutes of one place, and only what this room itself watched happen there.
 *
 * The strip used to be uniformly blank before the first mark, which made two different
 * facts look identical: nothing happened at this office, and this room had not opened yet.
 * They are not the same fact and the room already knows which is which — it knows when its
 * own door opened. Everywhere else this work refuses that exact confusion: an office it has
 * not been told about is drawn bare rather than empty, and a period naming no rain is drawn
 * as a band of another substance and never as blank space. The trace now keeps the same law.
 * The part of the strip older than the room is hatched in the bare-mark grey — the substance
 * that means "not a statement" here — and the door's own instant is a rule across it. */
function drawTrace(cv, id) {
  const c = cv.getContext("2d"); const now = Date.now(), span = 90 * 60000;
  const W0 = cv.width, H0 = cv.height;
  c.clearRect(0, 0, W0, H0);
  c.fillStyle = "rgba(255,255,255,0.03)"; c.fillRect(0, 0, W0, H0);

  const before = Math.max(0, (1 - Math.min(now - openedAt, span) / span)) * W0;
  if (before > 0.5) {
    c.save();
    c.beginPath(); c.rect(0, 0, before, H0); c.clip();
    c.strokeStyle = "rgba(140,160,175,0.22)"; c.lineWidth = 1;
    for (let x = -H0; x < before; x += 5) {
      c.beginPath(); c.moveTo(x, H0); c.lineTo(x + H0, 0); c.stroke();
    }
    c.restore();
    c.strokeStyle = "rgba(180,210,230,0.34)"; c.lineWidth = 1;
    c.beginPath(); c.moveTo(before + 0.5, 0); c.lineTo(before + 0.5, H0); c.stroke();
  }

  const at = t => (1 - (now - t) / span) * W0;
  for (const r of reissues) {
    if (r.office !== id || now - r.t > span) continue;
    const x = at(r.t);
    c.strokeStyle = "rgba(150,190,215,0.55)"; c.lineWidth = 1;
    c.beginPath(); c.moveTo(x - 2.5, 1.5); c.lineTo(x + 2.5, 1.5); c.stroke();
  }
  for (const r of recent) {
    if (r.office !== id || now - r.t > span) continue;
    const x = at(r.t);
    c.strokeStyle = r.kind === "lock" ? "rgba(150,220,235,0.9)"
                  : r.kind === "rupture" ? "rgba(235,150,90,0.9)" : "rgba(255,255,255,0.95)";
    c.lineWidth = 2; c.beginPath();
    if (r.kind === "rupture") { c.moveTo(x, 17); c.lineTo(x, 32); }
    else if (r.kind === "lock") { c.moveTo(x, 17); c.lineTo(x, 2); }
    else { c.moveTo(x, 1); c.lineTo(x, 33); }
    c.stroke();
  }
}

/* Everything else in this room fades: a lock, a rupture, a broken silence all have a named
   afterglow. The one gesture that belongs to the visitor was the only thing here that just
   stopped. It lets go on its own clock now, like the rest. */
function drawHeld(t) {
  let node = held, a = 0.35;
  if (!node) {
    const age = t - releasing;
    node = lastHeld;
    if (!node || age > RELEASE_MS) { releasing = 0; return; }
    a = 0.35 * (1 - age / RELEASE_MS);
  }
  ctx.strokeStyle = "rgba(190,220,235," + a.toFixed(3) + ")"; ctx.lineWidth = 1 * U;
  ctx.beginPath(); ctx.arc(node.x, node.y, RING_R[RING_R.length - 1] * U + 6 * U, 0, 6.2832); ctx.stroke();
  if (held && t - heldSince > 9000) release();
}

function release() {
  if (held) releasing = performance.now();
  held = null; heldItem = null; panel.className = "";
}

field.addEventListener("pointerdown", e => { unlock(); hold(e.clientX, e.clientY); });
field.addEventListener("pointermove", e => { if (held) hold(e.clientX, e.clientY); });
field.addEventListener("pointerup", release);
field.addEventListener("pointercancel", release);

/* ------------------------------------------------------------- the spoken record */
const reader = document.getElementById("reader");
function speak(item, kind) {
  let open = 0, numeric = 0, silent = 0, told = 0;
  for (const node of offices) {
    if (!node.unheard) told++;
    for (const it of node.live) {
      open += it.c.z; if (it.c.n != null) numeric += it.c.z; if (!it.c.w) silent += it.c.z;
    }
  }
  // The offices this room has been told about, not the offices it can draw. Those are
  // the same number tonight and are not the same number on a cold start, and the spoken
  // record may not claim breadth the room has not been given.
  let text = open.toLocaleString() + " forecast periods are standing open across "
    + told + " offices; " + numeric.toLocaleString() + " of them state a number, "
    + silent.toLocaleString() + " name no precipitation at all.";
  if (item) {
    const verb = kind === "lock" ? "kept" : kind === "rupture" ? "broken"
               : kind === "silence" ? "a silence broken by rain" : "held";
    text = item.office + ", " + item.c.p + ", " + verb + ": " + item.c.t + " " + text;
  }
  reader.textContent = text;
}

/* --------------------------------------------------------------------- the clock */
resize();
openedAt = Date.now();
relayMoved = openedAt;      // the room has not watched the record move yet, and says so by waiting
pull(true);
setInterval(() => pull(false), REFRESH_MS);
setInterval(settle, 1000);
// The guard that used to stand here set `stillDirty = false` every thirty seconds and did
// nothing whatsoever: `drawStill()` clears that flag itself on the very next frame it draws.
// It also keyed off a successful fetch, so under the failure it was written for — a relay
// that answers and has stopped writing — it could never reach its own trigger. The work it
// claimed to do is now done where it belongs, in `settle()`, off the relay's own stamp.
requestAnimationFrame(frame);
</script>
